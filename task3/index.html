<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-list | Лабораторная №3</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Todo-list</h1>
        
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Введите задачу...">
            <button id="add-btn">Добавить</button>
        </div>

        <div class="filters">
            <button class="filter-btn" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Завершённые</button>
        </div>

        <div id="counter" class="counter"></div>
        
        <ul id="todo-list"></ul>
    </div>
</body>
</html>
